name: Scheduled maintenance
description: Public notice from the SlateDsk team.
title: '[Maintenance] '
body:
  - type: markdown
    attributes:
      value: 'A collaborator with write access must add status-published and maintenance. The notice remains visible until the issue is closed. Specify whether it is planned, in progress or completed.'
  - type: textarea
    id: window
    attributes:
      label: Scheduled start and end, including time zone
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: Components, expected impact and current status
    validations:
      required: true
