name: Incident or public update
description: Authorized team updates. Never include personal data or secrets.
title: '[Incident] '
body:
  - type: markdown
    attributes:
      value: 'Published only when a collaborator with write access creates the notice and adds status-published. Authorized comments are published as updates.'
  - type: textarea
    id: impact
    attributes:
      label: Impact and affected components
    validations:
      required: true
  - type: textarea
    id: update
    attributes:
      label: Current status and next update (include time zone)
    validations:
      required: true
  - type: textarea
    id: cause
    attributes:
      label: Confirmed cause, or not yet confirmed
